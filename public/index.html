<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RelaxNote</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
:root,:root[data-theme="default"]{--bg:#0F0F0F;--panel:#433E3F;--panel2:#1b1919;--text:#EEEAF8;--muted:#a79fa3;--accent:#BEB8EB;--on-accent:#0F0F0F;--warm:#C69C72;--deep:#8E6E53;--line:#2a2627}
:root[data-theme="black"]{--bg:#2C302E;--panel:#383d3a;--panel2:#242826;--text:#F7F4EA;--muted:#9D8189;--accent:#668F80;--on-accent:#F7F4EA;--warm:#89608E;--deep:#9D8189;--line:#3d4340}
:root[data-theme="white"]{--bg:#E9F1F7;--panel:#f7fafc;--panel2:#dde8f0;--text:#040303;--muted:#6A7B76;--accent:#DD9787;--on-accent:#040303;--warm:#E59F71;--deep:#6A7B76;--line:#c9d6df}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Outfit","Segoe UI",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:1fr 88px;height:100%}
.side{grid-row:1/3;background:var(--panel2);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600;margin-bottom:18px;letter-spacing:.2px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent)}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--muted);text-align:left;width:100%;transition:background .15s,color .15s}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel);color:var(--text)}
.nav.on svg{color:var(--accent)}
.sp{flex:1}
.themes{display:flex;gap:8px;padding:6px 4px}
.sw{flex:1;height:34px;border-radius:10px;border:2px solid transparent;display:flex;overflow:hidden;padding:0}
.sw i{flex:1}
.sw.on{border-color:var(--accent)}
.main{overflow-y:auto;padding:26px 34px 30px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.top h1{margin:0;font-size:30px;font-weight:600;flex:1}
.btn{padding:10px 18px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ghost{background:var(--panel);color:var(--text)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{padding:8px 16px;border-radius:999px;background:var(--panel);color:var(--muted);transition:background .15s}
.chip.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.hero{border-radius:22px;padding:28px;margin-bottom:26px;background:linear-gradient(120deg,var(--warm),var(--accent));color:var(--on-accent);display:flex;align-items:center;gap:20px}
.hero h2{margin:0 0 6px;font-size:26px}
.hero p{margin:0 0 14px;opacity:.85}
.hero .btn{background:var(--text);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:var(--panel);border-radius:16px;padding:12px;text-align:left;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.art{aspect-ratio:1;border-radius:12px;margin-bottom:10px;display:grid;place-items:center;color:var(--on-accent)}
.card b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{color:var(--muted);font-size:13px}
.card.now{outline:2px solid var(--accent)}
h3{margin:0 0 14px;font-size:18px;font-weight:600}
.empty{padding:40px;text-align:center;color:var(--muted);background:var(--panel2);border-radius:16px}
.player{grid-column:2;background:var(--panel2);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;gap:16px;padding:0 24px}
.np{display:flex;align-items:center;gap:12px;min-width:0}
.np .art{width:52px;aspect-ratio:1;margin:0;flex:none}
.np div{min-width:0}
.np b,.np span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np span{color:var(--muted);font-size:13px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:14px}
.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.ic:hover{color:var(--text)}
.ic.fav.on{color:var(--accent)}
.play{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.bar{display:flex;align-items:center;gap:10px;width:100%;font-size:12px;color:var(--muted)}
.track{flex:1;height:5px;border-radius:5px;background:var(--panel);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent)}
.vol{display:flex;align-items:center;gap:8px;justify-content:flex-end;color:var(--muted)}
input[type=range]{accent-color:var(--accent);width:100px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;padding:20px;z-index:10}
.modal.open{display:grid}
.box{background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:26px;width:100%;max-width:360px}
.tabs{display:flex;gap:6px;background:var(--panel2);padding:4px;border-radius:999px;margin-bottom:18px}
.tabs button{flex:1;padding:9px;border-radius:999px;color:var(--muted)}
.tabs button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.box label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.box input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit}
.box .btn{width:100%;margin-top:18px}
.linkbtn{display:block;margin-top:10px;font-size:13px;color:var(--muted);text-decoration:underline}
.box .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text);margin-top:10px}
.verify{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.verify .chip{background:var(--panel2)}
.agree{font-size:12px;color:var(--muted);margin:12px 0 0;text-align:center}
.agree a,.legal a{color:var(--muted)}
.legal{font-size:12px;color:var(--muted);padding:6px 4px 0}
.msg{min-height:18px;font-size:13px;color:var(--warm);margin-top:10px}
.close{float:right;color:var(--muted)}
@media (max-width:760px){
.app{grid-template-columns:1fr;grid-template-rows:1fr auto auto;height:100%}
.side{grid-row:3;grid-column:1;flex-direction:row;padding:6px 8px;border-right:0;border-top:1px solid var(--line);gap:2px;justify-content:space-around}
.brand,.themes,.sp,.legal{display:none}
.nav{flex-direction:column;gap:3px;padding:8px 4px;font-size:12px;justify-content:center;align-items:center;width:auto;flex:1}
.player{grid-column:1;grid-row:2;grid-template-columns:1fr auto;padding:10px 14px;height:auto}
.vol,.bar{display:none}
.ctl{flex-direction:row}
.ctl .row{gap:6px}
.ic.sh,.ic.rp{display:none}
.main{padding:18px 16px}
.top h1{font-size:24px}
.hero{flex-direction:column;align-items:flex-start;padding:20px}
.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.mthemes{display:flex!important}
}
.mthemes{display:none;gap:6px}
.mthemes .sw{width:44px;flex:none;height:30px}
.np{cursor:pointer}
.full{position:fixed;inset:0;z-index:8;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 28px) 24px calc(env(safe-area-inset-bottom,0px) + 40px)}
.full.open{display:flex}
.fclose{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:18px;width:42px;height:42px;border-radius:50%;background:var(--panel);display:grid;place-items:center}
.ftext{text-align:center;margin-top:12vh;max-width:640px}
.ftext h2{margin:0;font-size:clamp(34px,7vw,60px);font-weight:500;line-height:1.1}
.ftext p{margin:12px 0 0;font-size:clamp(18px,3vw,26px);color:var(--muted)}
.fbottom{display:flex;flex-direction:column;align-items:center;gap:22px}
.disc{position:relative;width:min(300px,62vw);aspect-ratio:1}
.disc svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.disc circle{fill:none;stroke-width:3;stroke:var(--text)}
.disc .track-r{stroke:var(--line);stroke-width:4}
.disc .prog{stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-dasharray:578;stroke-dashoffset:578;transition:stroke-dashoffset .25s linear}
.disc .inner{stroke:var(--text)}
.full.playing .disc .inner{animation:pulse 2.4s ease-in-out infinite;transform-origin:100px 100px}
@keyframes pulse{50%{transform:scale(1.12)}}
.fplay{position:absolute;inset:0;margin:auto;width:34%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.fplay svg{width:42%;height:42%;transform:none}
.fplay:hover{color:var(--accent)}
.frow{display:flex;gap:26px;align-items:center}
.box2{background:var(--panel);border-radius:16px;padding:18px;margin-bottom:16px}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row2 input{flex:1;min-width:140px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit}
.big{font-size:44px;font-weight:600;margin:6px 0}
.sub{color:var(--muted);font-size:14px;display:block;margin-bottom:12px}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.tl .box2{margin:0}
.tl .chip{background:var(--panel2)}
.tl .chip.on{background:var(--accent)}
.search{width:100%;max-width:420px;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;margin-bottom:18px}
.viz{width:min(420px,80vw);height:70px}
.menu{position:fixed;z-index:12;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:190px;display:none;font-size:14px}
.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px}
.menu button:hover{background:var(--panel2)}
.menu span{display:block;padding:10px 12px;color:var(--muted)}
.form{display:grid;gap:12px;max-width:460px}
.form input,.form select{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit}
.chk{display:flex;gap:10px;font-size:14px;color:var(--muted);align-items:flex-start}
.form .chk input{margin-top:3px;width:auto}
.subrow,.rev{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.rev{flex-direction:column;align-items:stretch}
.rev audio{width:100%}
.badge{padding:3px 10px;border-radius:999px;font-size:12px;background:var(--panel2)}
.badge.approved{background:var(--accent);color:var(--on-accent)}
.badge.rejected{background:var(--warm);color:var(--on-accent)}
.fcover{display:none;width:min(240px,30vh);aspect-ratio:1;object-fit:cover;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.thumb{width:72px;height:72px;border-radius:12px;object-fit:cover}
.box2 .btn.ghost{background:var(--panel2);border:1px solid var(--line)}
.fcredit{margin:10px 0 0;font-size:14px;color:var(--muted)}
.fcredit a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M9 3v11.3A3.5 3.5 0 1 0 11 17.5V8h6V3H9z"/></svg></span>RelaxNote</div>
<button class="nav on" data-v="hub"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Hub</button>
<button class="nav" data-v="fav"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>Favorites</button>
<button class="nav" data-v="lib"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16M9 4v16M14 6l6 14M14 20l6-14" transform="translate(-1 0)"/></svg>My music</button>
<button class="nav" data-v="submit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>Submit</button>
<button class="nav" data-v="pl"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h13M3 12h13M3 18h8M19 15v6M16 18h6"/></svg>Playlists</button>
<button class="nav" data-v="tools"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>Focus</button>
<div class="sp"></div>
<div class="themes" id="themes"></div>
<div class="legal"><a href="/terms.html">Terms</a> and <a href="/privacy.html">Privacy</a></div>
</aside>
<main class="main" id="main"></main>
<section class="player">
<div class="np"><div class="art" id="pArt" style="background:var(--panel)"></div><div><b id="pTitle">Nothing playing</b><span id="pSub">Pick a track from the hub</span></div></div>
<div class="ctl">
<div class="row">
<button class="ic sh" id="shuf" aria-label="Shuffle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
<button class="ic" id="prev" aria-label="Previous"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
<button class="play" id="pp" aria-label="Play or pause"></button>
<button class="ic" id="next" aria-label="Next"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
<button class="ic" id="pAdd" aria-label="Add to playlist"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<button class="ic fav" id="pFav" aria-label="Favorite"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></button>
</div>
<div class="bar"><span id="cur">0:00</span><div class="track"><i id="fill"></i></div><span id="dur">3:00</span></div>
</div>
<div class="vol"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7"/></svg><input type="range" id="vol" min="0" max="100" value="70" aria-label="Volume"></div>
</section>
</div>

<div class="modal" id="modal">
<div class="box">
<button class="close" id="mClose" aria-label="Close">✕</button>
<div class="tabs"><button class="on" data-m="in">Sign in</button><button data-m="up">Sign up</button></div>
<div id="nameRow" style="display:none"><label for="aName">Name</label><input id="aName" autocomplete="name"></div>
<label for="aMail">Email</label><input id="aMail" type="email" autocomplete="email">
<div id="passRow"><label for="aPass">Password</label><input id="aPass" type="password" autocomplete="current-password"></div>
<button class="linkbtn" id="forgot" type="button">Forgot password?</button>
<div class="msg" id="aMsg"></div>
<button class="btn" id="aGo">Sign in</button>
<button class="btn ghost" id="aGoogle" type="button">Continue with Google</button>
<button class="linkbtn" id="backIn" type="button" style="display:none">Back to sign in</button>
<p class="agree">By continuing you agree to the <a href="/terms.html">Terms of Service</a> and the <a href="/privacy.html">Privacy Policy</a>.</p>
</div>
</div>
<div class="full" id="full">
<button class="fclose" id="fClose" aria-label="Close now playing"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
<div class="ftext"><h2 id="fTitle">Music name</h2><p id="fAuthor">Author</p><p class="fcredit" id="fCredit"></p></div>
<img class="fcover" id="fCover" alt="">
<div class="fbottom">
<canvas id="viz" class="viz"></canvas>
<div class="disc">
<svg viewBox="0 0 200 200"><circle class="track-r" cx="100" cy="100" r="92"/><circle class="prog" id="ring" cx="100" cy="100" r="92"/><circle class="inner" cx="100" cy="100" r="42"/></svg>
<button class="fplay" id="fPlay" aria-label="Play or pause"></button>
</div>
<div class="frow">
<button class="ic" id="fPrev" aria-label="Previous"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
<button class="ic" id="fAdd" aria-label="Add to playlist"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<button class="ic fav" id="fFav" aria-label="Favorite"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></button>
<button class="ic" id="fNext" aria-label="Next"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
</div>
</div>
</div>
<div class="menu" id="plMenu"></div>
<input type="file" id="file" accept="audio/*" multiple hidden>

<script>
const GENRES={
lofi:{label:"Lofi",bpm:76,prog:[57,53,48,55],iv:[0,3,7,10],wave:"triangle",cut:900,drums:"soft",bass:false,c:["#BEB8EB","#8E6E53"]},
electronic:{label:"Electronic",bpm:122,prog:[57,53,60,55],iv:[0,3,7,12],wave:"sawtooth",cut:1800,drums:"four",bass:true,c:["#C69C72","#BEB8EB"]},
rock:{label:"Rock",bpm:104,prog:[52,57,55,50],iv:[0,7,12],wave:"square",cut:1400,drums:"rock",bass:true,c:["#8E6E53","#C69C72"]},
metal:{label:"Metal",bpm:146,prog:[40,43,41,38],iv:[0,7,12],wave:"sawtooth",cut:2600,drums:"fast",bass:true,c:["#433E3F","#8E6E53"]},
kpop:{label:"(K)pop",bpm:112,prog:[60,55,57,53],iv:[0,4,7,11],wave:"triangle",cut:2200,drums:"pop",bass:true,c:["#BEB8EB","#C69C72"]}
};
GENRES.other={label:"Other",bpm:90,prog:[57,53,48,55],iv:[0,3,7],wave:"triangle",cut:1200,drums:"soft",bass:false,c:["#C69C72","#8E6E53"]};
const NAMES={lofi:["Rainy Window","Late Night Notes","Paper Lanterns"],electronic:["Neon Drive","Pulse Garden","Afterglow"],rock:["Open Road","Dust and Strings","Back Porch Riff"],metal:["Iron Tide","Black Ember","Hammerfall Dawn"],kpop:["Starlight Step","Sweet Static","Heart Signal"]};
const demo=[];
Object.keys(NAMES).forEach(g=>NAMES[g].forEach((n,i)=>demo.push({id:g+i,title:n,genre:g,artist:"RelaxNote Studio",bpm:GENRES[g].bpm+i*4,shift:[0,2,-2][i]})));

function store(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(k))}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
const state={view:"hub",genre:"all",cur:null,playing:false,shuffle:false,favs:store("rn_favs")||[],uploads:[],user:null,theme:store("rn_theme")||"default",beat:0,vol:.7,q:"",catalog:[],mine:[],pending:[]};

let msId=null;
let ctx,master,an,noiseBuf,timer=null,audioEl=null;
function ensureCtx(){
if(ctx)return;
ctx=new (window.AudioContext||window.webkitAudioContext)();
master=ctx.createGain();master.gain.value=state.vol;an=ctx.createAnalyser();an.fftSize=128;master.connect(an);an.connect(ctx.destination);
noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(m,t,len,type,cut,vol){
const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();
o.type=type;o.frequency.value=hz(m);f.type="lowpass";f.frequency.value=cut;
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+len);
o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+len+.05);
}
function kick(t,v){
const o=ctx.createOscillator(),g=ctx.createGain();
o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);
g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);
o.connect(g);g.connect(master);o.start(t);o.stop(t+.3);
}
function hat(t,v,len){
const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
s.buffer=noiseBuf;f.type="highpass";f.frequency.value=7000;
g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+len);
s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+len+.02);
}
function snare(t,v){
const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
s.buffer=noiseBuf;f.type="bandpass";f.frequency.value=1800;
g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.15);
s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+.2);
}
function step(){
const tr=state.cur,G=GENRES[tr.genre],b=state.beat,t=ctx.currentTime+.02,sec=60/tr.bpm;
const root=G.prog[Math.floor(b/4)%G.prog.length]+(tr.shift||0);
if(b%4===0)G.iv.forEach(i=>tone(root+12+i,t,sec*4.2,G.wave,G.cut,.07));
if(G.bass)tone(root-12,t,sec*.9,"sine",400,.22);
if(G.drums==="soft"){if(b%2===0)kick(t,.5);if(b%4===2)snare(t,.12);hat(t+sec/2,.07,.05)}
if(G.drums==="four"){kick(t,.7);hat(t+sec/2,.1,.06);if(b%2===1)snare(t,.12)}
if(G.drums==="rock"){if(b%2===0)kick(t,.7);else snare(t,.35);hat(t,.1,.05);hat(t+sec/2,.08,.05)}
if(G.drums==="fast"){kick(t,.8);kick(t+sec/2,.6);if(b%2===1)snare(t,.4);hat(t+sec/4,.06,.03);hat(t+sec*.75,.06,.03)}
if(G.drums==="pop"){if(b%4===0||b%4===2)kick(t,.6);if(b%2===1)snare(t,.25);hat(t+sec/2,.09,.05)}
state.beat++;
}
function startSynth(){
ensureCtx();if(ctx.state==="suspended")ctx.resume();
clearInterval(timer);state.beat=0;
const sec=60/state.cur.bpm;step();
timer=setInterval(step,sec*1000);
}
function stopAll(){clearInterval(timer);timer=null;if(audioEl)audioEl.pause()}

let elapsed=0,tick=null;
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function startTick(){
clearInterval(tick);
tick=setInterval(()=>{
if(!state.playing)return;
let total=180,pos;
if(state.cur.url&&audioEl){total=audioEl.duration||180;pos=audioEl.currentTime}else{elapsed+=.25;pos=elapsed;if(elapsed>=total){nextTrack();return}}
document.getElementById("cur").textContent=fmt(pos);
document.getElementById("dur").textContent=fmt(total);
document.getElementById("fill").style.width=Math.min(100,pos/total*100)+"%";
document.getElementById("ring").style.strokeDashoffset=578*(1-Math.min(1,pos/total));
},250);
}

function all(){return (state.catalog.length?state.catalog:demo).concat(state.uploads)}
function playTrack(tr){
stopAll();state.cur=tr;state.playing=true;elapsed=0;
document.getElementById("ring").style.strokeDashoffset=578;
document.getElementById("fill").style.width="0%";
if(tr.url){
if(!audioEl){audioEl=new Audio();audioEl.addEventListener("ended",nextTrack)}
ensureCtx();if(ctx.state==="suspended")ctx.resume();
if(!audioEl._n){audioEl._n=ctx.createMediaElementSource(audioEl);audioEl._n.connect(master)}
audioEl.src=tr.url;audioEl.play().catch(()=>{});
}else startSynth();
startTick();refresh();
}
function toggle(){
if(!state.cur){const l=all();playTrack(l[0]);return}
if(state.playing){
state.playing=false;
if(state.cur.url)audioEl.pause();else clearInterval(timer);
}else{
state.playing=true;
if(state.cur.url)audioEl.play();else{ctx.resume();timer=setInterval(step,60/state.cur.bpm*1000)}
}
refresh();
}
function nextTrack(){
const l=all();if(!l.length)return;
let i=l.findIndex(t=>t.id===(state.cur&&state.cur.id));
i=state.shuffle?Math.floor(Math.random()*l.length):(i+1)%l.length;
playTrack(l[i]);
}
function prevTrack(){
const l=all();if(!l.length)return;
let i=l.findIndex(t=>t.id===(state.cur&&state.cur.id));
playTrack(l[(i-1+l.length)%l.length]);
}
function toggleFav(id){
const i=state.favs.indexOf(id);
if(i>=0)state.favs.splice(i,1);else state.favs.push(id);
store("rn_favs",state.favs);refresh();
}

const ICON={play:'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>',pause:'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',note:'<svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" opacity=".8"><path d="M9 3v11.3A3.5 3.5 0 1 0 11 17.5V8h6V3H9z"/></svg>'};

}else if(state.view==="submit"){

}else if(state.view==="pl"){

}else if(state.view==="tools"){
html='<div class="top"><h1>Focus</h1>'+mt+acct+'</div><div class="tl"><div class="box2"><h3>Pomodoro</h3><div class="big" id="pomoTime">25:00</div><span class="sub" id="pomoMode">Focus</span><div class="row2"><button class="btn" id="pomoGo">Start</button><button class="btn ghost" id="pomoReset">Reset</button></div></div><div class="box2"><h3>Sleep timer</h3><div class="big" id="sleepLeft">Off</div><div class="chips">'+[15,30,60].map(m=>'<button class="chip" data-sleep="'+m+'">'+m+' min</button>').join("")+'<button class="chip" data-sleep="0">Off</button></div></div><div class="box2"><h3>Ambient sounds</h3><div class="chips">'+Object.keys(AMB).map(k=>'<button class="chip'+(amb[k]?" on":"")+'" data-amb="'+k+'">'+k[0].toUpperCase()+k.slice(1)+'</button>').join("")+'</div><label class="sub" for="ambVol">Ambient volume</label><input type="range" id="ambVol" min="0" max="100" value="'+Math.round(ambVol*100)+'"></div></div>';
}else{
html='<div class="top"><h1>My music</h1>'+mt+'<button class="btn ghost" id="addFiles">Add files</button>'+acct+'</div>'+(state.uploads.length?'<div class="grid">'+state.uploads.map(cardHtml).join("")+'</div>':'<div class="empty">Add audio files from your device to play them here. They stay on your device.</div>');
}
m.innerHTML=bannerHtml()+html;

}
function renderThemes(){
const defs={default:["#0F0F0F","#BEB8EB","#8E6E53"],black:["#2C302E","#668F80","#89608E"],white:["#E9F1F7","#DD9787","#E59F71"]};
const mk=()=>Object.keys(defs).map(k=>'<button class="sw'+(state.theme===k?" on":"")+'" data-t="'+k+'" aria-label="'+k+' theme">'+defs[k].map(c=>'<i style="background:'+c+'"></i>').join("")+'</button>').join("");
document.getElementById("themes").innerHTML=mk();
const mt=document.getElementById("mthemes");if(mt)mt.innerHTML=mk();
}
function refresh(){
const tr=state.cur;
document.getElementById("pp").innerHTML=state.playing?ICON.pause:ICON.play;
if(tr){
document.getElementById("pTitle").textContent=tr.title;
document.getElementById("pSub").textContent=(GENRES[tr.genre]?GENRES[tr.genre].label:"Your file");
document.getElementById("pArt").setAttribute("style",artStyle(tr));
}
document.getElementById("pFav").classList.toggle("on",!!tr&&state.favs.includes(tr.id));
document.getElementById("fTitle").textContent=tr?tr.title:"Nothing playing";
document.getElementById("fAuthor").textContent=tr?(tr.artist||"Unknown artist"):"Pick a track from the hub";
document.getElementById("fPlay").innerHTML=state.playing?ICON.pause:ICON.play;
document.getElementById("fFav").classList.toggle("on",!!tr&&state.favs.includes(tr.id));
document.getElementById("full").classList.toggle("playing",state.playing);
if(window.rnDesktop)window.rnDesktop.update({has:!!tr,title:tr?tr.title:"",artist:tr?(tr.artist||"Unknown artist"):"",cover:tr&&tr.cover?new URL(tr.cover,location.href).href:"",playing:state.playing,theme:state.theme});
const fi=document.getElementById("fCover");
if(tr&&tr.cover){fi.src=tr.cover;fi.style.display="block"}else fi.style.display="none";
if("mediaSession" in navigator&&tr){
try{
if(msId!==tr.id){msId=tr.id;navigator.mediaSession.metadata=new MediaMetadata({title:tr.title,artist:tr.artist||"RelaxNote",artwork:tr.cover?[{src:new URL(tr.cover,location.href).href}]:[]})}
navigator.mediaSession.playbackState=state.playing?"playing":"paused";
}catch(e){}
}
const fc=document.getElementById("fCredit");fc.textContent="";
if(tr&&tr.credit){
fc.append(tr.credit+(tr.license?" · "+tr.license:"")+" ");
if(tr.link){const a=document.createElement("a");a.href=tr.link;a.target="_blank";a.rel="noopener noreferrer";a.textContent="Source";fc.append(a)}
}
document.getElementById("shuf").style.color=state.shuffle?"var(--accent)":"";
document.querySelectorAll(".card").forEach(c=>c.classList.toggle("now",!!tr&&c.dataset.id===tr.id));
}
function setTheme(t){
state.theme=t;document.documentElement.setAttribute("data-theme",t);store("rn_theme",t);renderThemes();
}

document.addEventListener("click",e=>{
const t=e.target.closest("button,.card");if(!t)return;
if(t.dataset.v){state.view=t.dataset.v;document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("on",n===t));render();refresh();if(t.dataset.v==="submit")loadSubmit();return}
if(t.dataset.g){state.genre=t.dataset.g;render();refresh();return}
if(t.dataset.t){setTheme(t.dataset.t);return}
if(t.classList.contains("card")){const tr=all().find(x=>x.id===t.dataset.id);if(tr)playTrack(tr);return}
if(t.id==="shufAll"){state.shuffle=true;nextTrack();return}
if(t.id==="addFiles"){document.getElementById("file").click();return}
if(t.id==="acct"){if(state.user){if(window.rnAuth&&window.rnAuth.signOut)window.rnAuth.signOut();state.user=null;state.mine=[];state.pending=[];render()}else openModal();return}
});

document.querySelector(".np").onclick=()=>{if(state.cur)full.classList.add("open")};

document.getElementById("next").onclick=nextTrack;
document.getElementById("prev").onclick=prevTrack;

};

function authMsg(err){
const c=(err&&err.code)||"";
const map={
"auth/email-already-in-use":"That email already has an account. Sign in instead.",
"auth/invalid-credential":"Email or password is incorrect.",
"auth/wrong-password":"Email or password is incorrect.",
"auth/user-not-found":"Email or password is incorrect.",
"auth/invalid-email":"Enter a valid email address.",
"auth/weak-password":"Use a password with at least 8 characters.",
"auth/too-many-requests":"Too many attempts. Wait a few minutes and try again.",
"auth/network-request-failed":"Can't reach the sign-in service. Check your internet connection.",
"auth/user-disabled":"This account has been disabled.",
"auth/popup-closed-by-user":"The Google window was closed before signing in.",
"auth/cancelled-popup-request":"The Google window was closed before signing in.",
"auth/popup-blocked":"Your browser blocked the Google window. Allow pop-ups and try again.",
"auth/operation-not-allowed":"This sign-in method is not turned on yet."
};
return map[c]||"Something went wrong. Try again.";
}
function authReady(msg){
const a=window.rnAuth;
if(!a||!a.configured){msg.textContent=(a&&a.error)||"Sign-in is still loading. Try again in a moment.";return null}
return a;
}
document.getElementById("aGo").onclick=async()=>{
const mail=document.getElementById("aMail").value.trim(),pass=document.getElementById("aPass").value,name=document.getElementById("aName").value.trim();
const msg=document.getElementById("aMsg");
msg.textContent="";
if(!/^\S+@\S+\.\S+$/.test(mail)){msg.textContent="Enter a valid email address.";return}
const a=authReady(msg);if(!a)return;
try{
if(mode==="reset"){
await a.reset(mail).catch(e=>{if(e.code!=="auth/user-not-found")throw e});
msg.textContent="If an account exists for that email, a reset link is on its way. Check your inbox and spam folder.";
return;
}
if(mode==="up"){
if(!name){msg.textContent="Enter your name.";return}
if(pass.length<8){msg.textContent="Password must be at least 8 characters.";return}
await a.signUp(name,mail,pass);
}else{
if(!pass){msg.textContent="Enter your password.";return}
await a.signIn(mail,pass);
}
modal.classList.remove("open");
}catch(err){msg.textContent=authMsg(err)}
};
document.getElementById("aGoogle").onclick=async()=>{
const msg=document.getElementById("aMsg");
const a=authReady(msg);if(!a)return;
try{await a.google();modal.classList.remove("open")}catch(err){msg.textContent=authMsg(err)}
};
document.getElementById("forgot").onclick=()=>setMode("reset");

let pls=store("rn_pls")||[];
let ambVol=.5;
const AMB={rain:{hp:900,lp:9000,g:.5,lfo:0},cafe:{hp:200,lp:1200,g:.55,lfo:.35},waves:{hp:60,lp:700,g:.9,lfo:.12}};
const amb={};
const tool={sleep:0,pomo:{mode:"focus",left:1500,run:false}};
const LEN={focus:1500,break:300};
function hubList(){
const q=state.q.toLowerCase();
return all().filter(t=>(state.genre==="all"||t.genre===state.genre)&&(!q||(t.title+" "+(GENRES[t.genre]?GENRES[t.genre].label:"")).toLowerCase().includes(q)));
}
function ambient(k){
ensureCtx();if(ctx.state==="suspended")ctx.resume();
if(amb[k]){
const a=amb[k];a.g.gain.setTargetAtTime(0,ctx.currentTime,.2);
setTimeout(()=>{a.s.stop();if(a.l)a.l.stop();a.g.disconnect()},900);
delete amb[k];return;
}
const c=AMB[k],s=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),lp=ctx.createBiquadFilter(),g=ctx.createGain();
s.buffer=noiseBuf;s.loop=true;hp.type="highpass";hp.frequency.value=c.hp;lp.type="lowpass";lp.frequency.value=c.lp;
g.gain.value=0;s.connect(hp);hp.connect(lp);lp.connect(g);g.connect(master);s.start();
g.gain.setTargetAtTime(c.g*ambVol,ctx.currentTime,.4);
let l=null;
if(c.lfo){l=ctx.createOscillator();const d=ctx.createGain();l.frequency.value=c.lfo;d.gain.value=c.g*ambVol*.5;l.connect(d);d.connect(g.gain);l.start()}
amb[k]={s,g,l,c};
}
function endSleep(){
tool.sleep=0;
if(master)master.gain.setTargetAtTime(0,ctx.currentTime,4);
setTimeout(()=>{
if(state.playing)toggle();
Object.keys(amb).forEach(ambient);
if(master)master.gain.value=state.vol;
paintTools();
},10000);
}
function beep(){
ensureCtx();if(ctx.state==="suspended")ctx.resume();
tone(81,ctx.currentTime,.6,"sine",3000,.2);tone(88,ctx.currentTime+.25,.6,"sine",3000,.2);
}
function mmss(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function paintTools(){
const a=document.getElementById("sleepLeft");
if(a)a.textContent=tool.sleep?mmss(tool.sleep)+" left":"Off";
const t=document.getElementById("pomoTime");
if(t){
t.textContent=mmss(tool.pomo.left);
document.getElementById("pomoMode").textContent=tool.pomo.mode==="focus"?"Focus time":"Break time";
document.getElementById("pomoGo").textContent=tool.pomo.run?"Pause":"Start";
}
}
setInterval(()=>{
if(tool.sleep>0){tool.sleep--;if(tool.sleep===0)endSleep()}
const p=tool.pomo;
if(p.run){p.left--;if(p.left<=0){beep();p.mode=p.mode==="focus"?"break":"focus";p.left=LEN[p.mode]}}
paintTools();
},1000);

const menu=document.getElementById("plMenu");
function openMenu(btn){
if(!state.cur)return;
const r=btn.getBoundingClientRect();
menu.innerHTML=pls.length?pls.map((p,i)=>'<button data-add="'+i+'">'+esc(p.name)+'</button>').join(""):'<span>No playlists yet. Create one in Playlists.</span>';
menu.style.display="block";
menu.style.left=Math.max(8,Math.min(innerWidth-208,r.left))+"px";
menu.style.top=Math.max(8,r.top-menu.offsetHeight-8)+"px";
}
document.getElementById("pAdd").onclick=e=>{e.stopPropagation();openMenu(e.currentTarget)};
document.getElementById("fAdd").onclick=e=>{e.stopPropagation();openMenu(e.currentTarget)};
document.addEventListener("click",e=>{
const a=e.target.closest("[data-add]");
if(a){
const p=pls[+a.dataset.add];
if(p&&state.cur&&!p.ids.includes(state.cur.id)){p.ids.push(state.cur.id);store("rn_pls",pls)}
menu.style.display="none";if(state.view==="pl")render();return;
}
menu.style.display="none";
const b=e.target.closest("button");if(!b)return;
if(b.id==="plNew"){
const el=document.getElementById("plName"),n=el.value.trim();
if(n){pls.push({name:n,ids:[]});store("rn_pls",pls);render()}
return;
}
if(b.dataset.pdel){pls.splice(+b.dataset.pdel,1);store("rn_pls",pls);render();return}
if(b.dataset.pplay){
const p=pls[+b.dataset.pplay],l=p.ids.map(id=>all().find(t=>t.id===id)).filter(Boolean);
if(l.length)playTrack(l[0]);return;
}
if(b.dataset.sleep!==undefined){tool.sleep=+b.dataset.sleep*60;document.querySelectorAll("[data-sleep]").forEach(x=>x.classList.toggle("on",x===b&&tool.sleep>0));paintTools();return}
if(b.dataset.amb){ambient(b.dataset.amb);b.classList.toggle("on");return}
if(b.id==="pomoGo"){tool.pomo.run=!tool.pomo.run;paintTools();return}
if(b.id==="pomoReset"){tool.pomo={mode:"focus",left:LEN.focus,run:false};paintTools()}
});
document.addEventListener("input",e=>{
if(e.target.id==="q"){
state.q=e.target.value;
document.getElementById("hubGrid").innerHTML=hubList().map(cardHtml).join("")||'<div class="empty">No matches.</div>';
refresh();
}
if(e.target.id==="ambVol"){
ambVol=e.target.value/100;
Object.keys(amb).forEach(k=>amb[k].g.gain.setTargetAtTime(amb[k].c.g*ambVol,ctx.currentTime,.1));
}
});

const cv=document.getElementById("viz"),cx=cv.getContext("2d");
function draw(){
requestAnimationFrame(draw);
if(!full.classList.contains("open")||!an)return;
const w=cv.clientWidth,h=cv.clientHeight;
if(cv.width!==w*2){cv.width=w*2;cv.height=h*2}
const d=new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(d);
cx.clearRect(0,0,cv.width,cv.height);
cx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--accent");
const n=40,bw=cv.width/n;
for(let i=0;i<n;i++){
const v=d[Math.floor(i*d.length*.7/n)]/255,bh=Math.max(4,v*cv.height);
cx.fillRect(i*bw+bw*.2,(cv.height-bh)/2,bw*.6,bh);
}
}
draw();

async function api(url,opt){
opt=opt||{};opt.headers=opt.headers||{};
const tok=window.rnAuth&&window.rnAuth.configured?await window.rnAuth.token():null;
if(tok)opt.headers.Authorization="Bearer "+tok;
if(opt.body&&!(opt.body instanceof FormData)){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(opt.body)}
const r=await fetch(url,opt);
let d={};try{d=await r.json()}catch(e){}
if(!r.ok)throw new Error(d.error||"Something went wrong. Try again.");
return d;
}
async function quietRefresh(){
if(!state.user||state.view!=="submit")return;
try{
const mine=await api("/api/mine");
const pending=state.user.role==="admin"?await api("/api/admin/pending"):[];
const key=x=>JSON.stringify(x.map(y=>[y.id,y.status||""]));
const mineBox=document.getElementById("mineBox"),rq=document.getElementById("rq");
if(key(mine)!==key(state.mine)){state.mine=mine;if(mineBox)mineBox.innerHTML=mineHtml()}
if(key(pending)!==key(state.pending)){
const typing=rq&&rq.contains(document.activeElement);
state.pending=pending;
if(rq&&!typing)rq.innerHTML=queueHtml();
}
}catch(e){}
}
setInterval(quietRefresh,10000);
window.addEventListener("focus",quietRefresh);
async function loadCatalog(){
try{state.catalog=await api("/api/songs");render();refresh()}catch(e){}
}
async function loadSubmit(){
if(!state.user)return;
try{
state.mine=await api("/api/mine");
state.pending=state.user.role==="admin"?await api("/api/admin/pending"):[];
if(state.view==="submit")render();
}catch(e){}
}
function mineHtml(){
return '<h3>Your submissions</h3>'+(state.mine.length?state.mine.map(x=>'<div class="subrow"><b>'+esc(x.title)+'</b><span class="badge '+x.status+'">'+x.status+'</span>'+(x.reason?'<span class="sub" style="margin:0">'+esc(x.reason)+'</span>':'')+'</div>').join(""):'<span class="sub">Nothing submitted yet.</span>');
}
function queueHtml(){
return '<h3>Review queue ('+state.pending.length+')</h3>'+(state.pending.length?state.pending.map(x=>'<div class="rev">'+(x.cover?'<img class="thumb" alt="" src="'+x.cover+'">':'')+'<b>'+esc(x.title)+'</b><span class="sub" style="margin:0">'+esc(x.artist)+' · '+esc(GENRES[x.genre]?GENRES[x.genre].label:x.genre)+'</span><audio controls preload="metadata" src="'+x.url+'"></audio><div class="row2"><input id="rj-'+x.id+'" placeholder="Reason if rejected" maxlength="120"><button class="btn" data-approve="'+x.id+'">Approve</button><button class="btn ghost" data-reject="'+x.id+'">Reject</button></div></div>').join(""):'<span class="sub">Nothing waiting for review.</span>');
}
function bannerHtml(){
if(!state.user||state.user.verified)return "";
return '<div class="verify"><span>Verify your email to submit songs. We sent a link to <b>'+esc(state.user.email)+'</b>.</span><button class="chip" id="vResend">Resend email</button><button class="chip" id="vDone">I have verified</button><span id="vMsg"></span></div>';
}
function submitHtml(){
if(!state.user)return '<div class="empty">Sign in to submit your own songs. Every song is reviewed before it appears in the catalog.</div>';
let h='<div class="box2"><h3>New submission</h3><div class="form"><input id="sTitle" placeholder="Song title" maxlength="80"><select id="sGenre">'+Object.keys(GENRES).map(g=>'<option value="'+g+'">'+GENRES[g].label+'</option>').join("")+'</select><input id="sFile" type="file" accept=".mp3,.wav,.ogg,.flac,.m4a,audio/*"><label class="sub" style="margin:0" for="sCover">Cover art (optional): jpg, png or webp, up to 3 MB</label><input id="sCover" type="file" accept="image/jpeg,image/png,image/webp"><label class="chk"><input type="checkbox" id="sOk"><span>I made this song, I have the right to share it, and it has no swearing or hateful content.</span></label><button class="btn" id="subGo">Submit for review</button><div class="msg" id="subMsg"></div></div></div>';
h+='<div class="box2" id="mineBox">'+mineHtml()+'</div>';
if(state.user.role==="admin"){
h+='<div class="box2" id="rq">'+queueHtml()+'</div>';
}
return h;
}
document.addEventListener("click",async e=>{
const b=e.target.closest("button");if(!b)return;
try{
if(b.id==="subGo"){
const m=document.getElementById("subMsg"),f=document.getElementById("sFile").files[0],title=document.getElementById("sTitle").value.trim();
if(!title){m.textContent="Enter a song title.";return}
if(!f){m.textContent="Choose an audio file (mp3, wav, ogg, flac or m4a).";return}
if(!document.getElementById("sOk").checked){m.textContent="Tick the confirmation box to continue.";return}
const fd=new FormData();
fd.append("title",title);fd.append("genre",document.getElementById("sGenre").value);fd.append("confirm","yes");fd.append("audio",f);
const cf=document.getElementById("sCover").files[0];
if(cf){if(cf.size>3*1024*1024){m.textContent="Cover art must be 3 MB or smaller.";return}fd.append("cover",cf)}
m.textContent="Uploading...";
await api("/api/upload",{method:"POST",body:fd});
await loadSubmit();
const m2=document.getElementById("subMsg");if(m2)m2.textContent="Submitted. It appears in the catalog after review.";
return;
}
if(b.dataset.approve){await api("/api/admin/songs/"+b.dataset.approve+"/approve",{method:"POST"});await loadSubmit();loadCatalog();return}
if(b.dataset.reject){
const r=document.getElementById("rj-"+b.dataset.reject).value;
await api("/api/admin/songs/"+b.dataset.reject+"/reject",{method:"POST",body:{reason:r}});
await loadSubmit();
}
}catch(err){const m=document.getElementById("subMsg");if(m)m.textContent=err.message}
});
if(window.rnDesktop)window.rnDesktop.onCommand(c=>{if(c==="toggle")toggle();else if(c==="next")nextTrack();else if(c==="prev")prevTrack()});
if("mediaSession" in navigator){
try{
navigator.mediaSession.setActionHandler("play",()=>{if(!state.playing)toggle()});
navigator.mediaSession.setActionHandler("pause",()=>{if(state.playing)toggle()});
navigator.mediaSession.setActionHandler("nexttrack",nextTrack);
navigator.mediaSession.setActionHandler("previoustrack",prevTrack);
}catch(e){}
}
document.addEventListener("keydown",e=>{
if(e.code!=="Space"||e.target.closest("input,textarea,select,button,audio"))return;
e.preventDefault();toggle();
});
async function loadMe(){
try{state.user=await api("/api/me")}catch(e){state.user=null}
}
window.addEventListener("rnauth-change",async e=>{
if(e.detail){await loadMe();render();loadSubmit()}
else{state.user=null;state.mine=[];state.pending=[];render()}
});
document.addEventListener("click",async e=>{
const b=e.target.closest("button");if(!b)return;
const a=window.rnAuth;
if(b.id==="vResend"){
const m=document.getElementById("vMsg");
try{await a.resend();m.textContent="Sent. Check your inbox and spam folder."}catch(err){m.textContent=authMsg(err)}
}
if(b.id==="vDone"){
const m=document.getElementById("vMsg");
try{await a.refresh();await loadMe();render();loadSubmit();if(state.user&&!state.user.verified){const m2=document.getElementById("vMsg");if(m2)m2.textContent="Not verified yet. Open the link in the email first."}}catch(err){m.textContent=authMsg(err)}
}
});
setMode("in");
loadCatalog();
document.documentElement.setAttribute("data-theme",state.theme);
render();refresh();
</script>
<script type="module" src="/auth.js"></script>
