<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Connect to a server</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0F0F0F;color:#EEEAF8;font-family:"Outfit","Segoe UI",system-ui,sans-serif;padding:26px}
h1{font-size:20px;margin:0 0 8px;font-weight:600}
p{margin:0 0 14px;color:#a79fa3;font-size:14px;line-height:1.5}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #433E3F;background:#1b1919;color:#EEEAF8;font:inherit}
input:focus-visible{outline:2px solid #BEB8EB;outline-offset:2px}
.row{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
button{font:inherit;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;background:#433E3F;color:#EEEAF8}
button.go{background:#BEB8EB;color:#0F0F0F;font-weight:600}
.msg{min-height:18px;margin-top:8px;font-size:13px;color:#C69C72}
</style>
</head>
<body>
<h1>Connect to a server</h1>
<p>Enter the address of the RelaxNote server you want to use, for example http://localhost:3000. Leave it empty to use the built-in server. You will need to sign in again after switching.</p>
<input id="url" placeholder="http://localhost:3000" autofocus>
<div class="msg" id="msg"></div>
<div class="row"><button id="cancel">Cancel</button><button class="go" id="save">Save</button></div>
<script>
const $=id=>document.getElementById(id);
connect.onInit(v=>{$("url").value=v||""});
$("save").onclick=()=>{
const v=$("url").value.trim();
if(v&&!/^https?:\/\/\S+$/.test(v)){$("msg").textContent="The address must start with http:// or https://";return}
connect.save(v);
};
$("cancel").onclick=()=>connect.cancel();
$("url").addEventListener("keydown",e=>{if(e.key==="Enter")$("save").click()});
</script>
</body>
</html>
