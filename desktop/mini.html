<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src http: https: data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>RelaxNote mini player</title>
<style>
:root,:root[data-theme="default"]{--card:#1b1919;--text:#EEEAF8;--muted:#a79fa3;--accent:#BEB8EB;--on:#0F0F0F;--line:#433E3F}
:root[data-theme="black"]{--card:#242826;--text:#F7F4EA;--muted:#9D8189;--accent:#668F80;--on:#F7F4EA;--line:#3d4340}
:root[data-theme="white"]{--card:#f7fafc;--text:#040303;--muted:#6A7B76;--accent:#DD9787;--on:#040303;--line:#c9d6df}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Outfit","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.card,.tab{height:100%;width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-left:0;border-bottom:0}
.tab{display:flex;align-items:center;justify-content:center;border-radius:0 14px 0 0;border-left:0;color:var(--accent);cursor:pointer}
.card{display:none;align-items:center;gap:12px;padding:12px 14px 12px 12px;border-radius:0 16px 0 0}
.exp .card{display:flex}
.exp .tab{display:none}
.cv{width:70px;height:70px;border-radius:12px;flex:none;background:linear-gradient(135deg,var(--accent),#C69C72) center/cover no-repeat;cursor:pointer}
.info{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.a{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.ctl{display:flex;align-items:center;gap:14px}
.ic{width:28px;height:28px;display:grid;place-items:center;color:var(--muted)}
.ic:hover{color:var(--text)}
.pp{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on);display:grid;place-items:center}
</style>
</head>
<body>
<div class="tab" id="tab" title="RelaxNote"><span id="tabIcon"></span></div>
<div class="card" id="card">
<div class="cv" id="cv"></div>
<div class="info">
<div class="t" id="t">Song name</div>
<div class="a" id="a">Author</div>
<div class="ctl">
<button class="ic" id="prev" aria-label="Previous"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
<button class="pp" id="pp" aria-label="Play or pause"></button>
<button class="ic" id="next" aria-label="Next"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
</div>
</div>
</div>
<script>
const PLAY='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>';
const PAUSE='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
const NOTE='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M9 3v11.3A3.5 3.5 0 1 0 11 17.5V8h6V3H9z"/></svg>';
const $=id=>document.getElementById(id);
$("tabIcon").innerHTML=NOTE;
mini.onState(s=>{
document.documentElement.setAttribute("data-theme",s.theme||"default");
$("t").textContent=s.title||"Nothing playing";
$("a").textContent=s.artist||"";
$("cv").style.backgroundImage=s.cover?'url("'+s.cover.replace(/"/g,"%22")+'")':"";
$("pp").innerHTML=s.playing?PAUSE:PLAY;
$("tabIcon").innerHTML=s.playing?PAUSE:NOTE;
});
mini.onExpanded(x=>document.body.classList.toggle("exp",x));
$("prev").onclick=()=>mini.cmd("prev");
$("pp").onclick=()=>mini.cmd("toggle");
$("next").onclick=()=>mini.cmd("next");
$("cv").onclick=()=>mini.open();
$("t").onclick=()=>mini.open();
document.addEventListener("mouseenter",()=>mini.hover(true));
document.addEventListener("mouseleave",()=>mini.hover(false));
document.body.addEventListener("mouseenter",()=>mini.hover(true));
document.body.addEventListener("mouseleave",()=>mini.hover(false));
</script>
</body>
</html>
